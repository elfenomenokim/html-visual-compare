name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (26.04) ships no 3.9 build; 3.9 is macOS's system Python, so keep it on 22.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . pytest
      # The suite captures with Playwright's own Chromium, never a browser the host already
      # had, so every runner installs it. Linux also needs the Chromium system libraries.
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium (macOS, Windows)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Test the installed package
        run: python -m pytest -q tests
